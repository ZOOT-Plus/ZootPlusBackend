spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://100.84.158.57:5432/zoot
    username: root
    password: admin
  flyway:
    enabled: true
  profiles:
    active: dev
  servlet:
    multipart:
      #最大文件阈值
      max-file-size: 500KB
      #最大请求阈值
      max-request-size: 500KB
  freemarker:
    check-template-location: false
  # 缓存配置，使用caffeine缓存框架，缓存时长为5分钟，最大缓存数量500
  # 注意：声明了 cache-names 后 CacheManager 不再动态创建缓存，@Cacheable 用到的新名字必须在此登记，
  # 否则启动后访问该端点会抛 Cannot find cache named '...'；arkLevelSnapshotsV2 有意不在此列——
  # 它由 CacheConfig 以独立 TTL 注册（写路径事件主动失效，见 ArkLevelsSyncedEvent）
  cache:
    cache-names: arkLevel, arkLevelInfos, copilotPage
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s
server:
  # 8848钛金接口.jpg
  port: 8848
  tomcat:
    #限制post表单最大为30KB
    max-http-form-post-size: 30KB
  compression:
    enabled: true

logging:
  file:
    name: ./logs/latest.log
  logback:
    rollingpolicy:
      max-history: 14
      clean-history-on-start: true
