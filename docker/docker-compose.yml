services:
  redis:
    image: redis:latest
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
  db:
    image: docker.io/abcfy2/zhparser:18-alpine
    container_name: postgres
    restart: always
    command: ["postgres", "-c", "zhparser.extra_dicts=arknights.txt", "-c", "zhparser.multi_duality=on", "-c", "zhparser.multi_zmain=on"]
    ports:
      - "5432:5432"
    volumes:
      # PG18 集群实际在 /var/lib/postgresql/18/docker；数据目录布局变更前务必按
      # docs/zhparser-migration.md 4.1 预检，否则旧集群会被忽略并重新 initdb（看起来像丢数据）
      - ../data/:/var/lib/postgresql/
      - ../src/main/resources/arknights.txt:/usr/local/share/postgresql/tsearch_data/arknights.txt:ro
    environment:
      POSTGRES_PASSWORD: 1234
  zootplusbackend:
    image: ghcr.io/zoot-plus/zootplusbackend:latest
    container_name: ZootPlusBackend
    command: --spring.profiles.active=prod
    ports:
      - "8080:8080"
    volumes:
      - ./application-prod.yml:/app/application-prod.yml:ro
    links:
      - redis
      - db
    restart: always
    depends_on:
      - redis
      - db
